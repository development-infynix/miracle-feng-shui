<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1440px;height:900px;background:#EEEBE3;font-family:Geist,Arial,sans-serif;color:#141210;overflow:hidden;position:relative}
.nav{display:flex;align-items:center;justify-content:space-between;padding:24px 56px}
.brand{display:flex;align-items:center;gap:10px;font:400 24px 'Young Serif',Georgia}
.brand i{width:34px;height:34px;border-radius:50%;background:#431769;display:block}
.links span{font-weight:500;font-size:16px;margin:0 22px}
.cart{background:#141210;color:#EEEBE3;border-radius:999px;padding:12px 22px;font-weight:600}
.intro{display:grid;grid-template-columns:1.35fr 1fr;gap:64px;padding:40px 56px 0;align-items:end}
h1{font:400 92px/0.98 'Young Serif',Georgia;letter-spacing:-0.03em;margin:0}
p{font-size:19px;line-height:1.5;margin:0 0 24px;max-width:440px}
.btns{display:flex;gap:12px}.b1{background:#141210;color:#EEEBE3;border-radius:999px;padding:16px 28px;font-weight:600}
.b2{border:1.5px solid #141210;border-radius:999px;padding:15px 26px;font-weight:600}
.glow{position:absolute;left:880px;top:120px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(231,169,59,.55),rgba(231,169,59,0) 65%);filter:blur(8px)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:56px 56px 0}
.head{grid-column:1/5;display:flex;justify-content:space-between;align-items:baseline}
.head b{font:400 34px 'Young Serif',Georgia}.head span{font-weight:600;border-bottom:1.5px solid #141210}
.card{background:#fff;border-radius:10px;padding:8px}
.card i{display:block;height:200px;background:#D9D4C7;border-radius:6px}
</style></head><body>
<div class="glow"></div>
<div class="nav"><div class="brand"><i></i>Miracle feng shui</div><div class="links"><span>Categories</span><span>Products</span><span>Search</span></div><div class="cart">Cart (2)</div></div>
<div class="intro"><h1>Bring wealth, calm and protection home.</h1>
<div><p>Feng shui decor, jewelry, candles, crystals and books, chosen and packed by hand.</p><div class="btns"><div class="b1">Shop new arrivals</div><div class="b2">Browse categories</div></div></div></div>
<div class="row"><div class="head"><b>New arrivals</b><span>View all</span></div>
<div class="card"><i></i></div><div class="card"><i></i></div><div class="card"><i></i></div><div class="card"><i></i></div></div>
</body></html>
